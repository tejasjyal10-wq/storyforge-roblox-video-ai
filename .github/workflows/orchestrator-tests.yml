
name: StoryForge Orchestrator Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  orchestrator-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Orchestrator tests
        run: node --test agents/orchestrator.test.js
        
