<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryForge | Production</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <h2>StoryForge</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="prompt.html">Create Story</a>
        <a href="production.html">Production</a>
    </div>
</nav>

<main class="production-page">

    <!-- VIDEO -->
    <section class="video-section">
        <h1>Your Video</h1>

        <div class="video-wrapper">
            <video id="productionVideo" controls></video>

            <div class="video-placeholder" id="videoPlaceholder">
                <div class="play-icon">▶</div>
                <h2>Your video is being produced</h2>
            </div>
        </div>

        <!-- PERCENTAGE PROGRESS -->
        <div class="progress-section">
            <div class="progress-heading">
                <span>Production Progress</span>
                <span id="progressPercentage">0%</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </section>

    <!-- FEEDBACK -->
<section class="content-section" id="feedbackSection" hidden>
    <h2>Feedback</h2>
    <p>Write your own feedback about the finished video.</p>

    <textarea
        id="feedbackInput"
        placeholder="Write your feedback here..."
        rows="6"
    ></textarea>
</section>

<!-- VIDEO IMPROVEMENTS -->
<section class="content-section" id="improvementsSection" hidden>
    <h2>Video Improvements</h2>
    <p>Write the improvements you want to make to your video.</p>

    <textarea
        id="improvementsInput"
        placeholder="Write your video improvements here..."
        rows="6"
    ></textarea>
</section>
    <!-- DOWNLOAD -->
    <button id="downloadVideoBtn" class="download-button">
        ↓ Download Video
    </button>

    <!-- HOME -->
    <a href="index.html" class="home-button">
        Return to Home Page
    </a>

</main>

<script src="production.js"></script>
</body>
</html>
